name: Reusable Deploy Workflow

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      image_tag:
        required: false
        type: string
        default: latest
      target_platforms:
        required: false
        type: string
        default: linux/arm64

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR with retry
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail

          for delay in 0 5 15 30; do
            if [ "$delay" != "0" ]; then
              echo "Retrying GHCR login in ${delay}s..."
              sleep "$delay"
            fi

            if echo "$GHCR_TOKEN" | docker login ghcr.io \
              -u "$GHCR_USER" \
              --password-stdin; then
              echo "GHCR login successful."
              exit 0
            fi
          done

          echo "GHCR login failed after retries."
          exit 1

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: ${{ inputs.target_platforms }}
          tags: ${{ inputs.image_name }}:${{ inputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_DEPLOY_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure project directory exists on VPS
        run: |
          PROJECT_NAME="${{ github.event.repository.name }}"
          PROJECT_DIR="/home/deployer/stacks/projects/${PROJECT_NAME}"

          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "mkdir -p '${PROJECT_DIR}'"

      - name: Sync deploy files to VPS
        run: |
          PROJECT_NAME="${{ github.event.repository.name }}"
          PROJECT_DIR="/home/deployer/stacks/projects/${PROJECT_NAME}"

          rsync -az \
            --exclude ".git" \
            --exclude ".github" \
            ./docker-compose.yml \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${PROJECT_DIR}/"

          if [ -d "./db" ]; then
            rsync -az \
              --delete \
              ./db/ \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${PROJECT_DIR}/db/"
          fi

          for dir in bot worker services; do
            if [ -d "./$dir" ]; then
              echo "Syncing sidecar directory: $dir"

              rsync -az \
                --delete \
                --exclude ".git" \
                --exclude "node_modules" \
                --exclude "__pycache__" \
                --exclude ".venv" \
                --exclude ".pytest_cache" \
                --exclude ".mypy_cache" \
                --exclude ".ruff_cache" \
                --exclude ".env" \
                --exclude ".env.*" \
                "./$dir/" \
                "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${PROJECT_DIR}/$dir/"
            fi
          done

      - name: Prepare .env, run migrations, deploy on VPS
        run: |
          PROJECT_NAME="${{ github.event.repository.name }}"
          PROJECT_DIR="/home/deployer/stacks/projects/${PROJECT_NAME}"
          GITHUB_REPOSITORY="${{ github.repository }}"

          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << EOF
            set -euo pipefail

            PROJECT_DIR="${PROJECT_DIR}"
            PROJECT_NAME="${PROJECT_NAME}"
            GITHUB_REPOSITORY="${GITHUB_REPOSITORY}"

            mkdir -p "\$PROJECT_DIR"

            if [ ! -f "\$PROJECT_DIR/.env" ]; then
              cp /home/deployer/env/global.env "\$PROJECT_DIR/.env"
            fi

            grep -q '^PROJECT_NAME=' "\$PROJECT_DIR/.env" || echo "PROJECT_NAME=\$PROJECT_NAME" >> "\$PROJECT_DIR/.env"
            grep -q '^GITHUB_REPOSITORY=' "\$PROJECT_DIR/.env" || echo "GITHUB_REPOSITORY=\$GITHUB_REPOSITORY" >> "\$PROJECT_DIR/.env"
            grep -q '^REPO_NAME=' "\$PROJECT_DIR/.env" || echo "REPO_NAME=\$PROJECT_NAME" >> "\$PROJECT_DIR/.env"

            cd "\$PROJECT_DIR"

            if [ -f ".env" ]; then
              export DATABASE_URL="\$(grep '^DATABASE_URL=' .env | cut -d '=' -f2- || true)"
            fi

            if [ -f "db/migrate.sh" ]; then
              echo "Migration script found, running migrations..."
              chmod +x db/migrate.sh
              ./db/migrate.sh
            else
              echo "No migration script found, skipping migrations."
            fi

            docker compose pull
            docker compose up -d --build --remove-orphans
          EOF
