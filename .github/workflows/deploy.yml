name: Reusable Deploy Workflow

on:
  workflow_call:
    inputs:
      deploy_path:
        required: true
        type: string
      image_name:
        required: true
        type: string
      image_tag:
        required: false
        type: string
        default: latest

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ inputs.image_name }}:${{ inputs.image_tag }}

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_DEPLOY_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure project directory exists on VPS
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "mkdir -p '${{ inputs.deploy_path }}'"

      - name: Sync docker-compose.yml to VPS
        run: |
          rsync -az \
            --exclude ".git" \
            --exclude ".github" \
            ./docker-compose.yml \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ inputs.deploy_path }}/"

      - name: Prepare .env and deploy on VPS
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << EOF
            set -euo pipefail

            PROJECT_DIR="${{ inputs.deploy_path }}"
            PROJECT_NAME="$(basename "$PROJECT_DIR")"
            REPO_NAME="${{ github.event.repository.name }}"
            GITHUB_REPOSITORY="${{ github.repository }}"

            mkdir -p "$PROJECT_DIR"

            if [ ! -f "$PROJECT_DIR/.env" ]; then
              cp /home/deployer/env/global.env "$PROJECT_DIR/.env"
            fi

            grep -q '^PROJECT_NAME=' "$PROJECT_DIR/.env" || echo "PROJECT_NAME=$PROJECT_NAME" >> "$PROJECT_DIR/.env"
            grep -q '^GITHUB_REPOSITORY=' "$PROJECT_DIR/.env" || echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY" >> "$PROJECT_DIR/.env"
            grep -q '^REPO_NAME=' "$PROJECT_DIR/.env" || echo "REPO_NAME=$REPO_NAME" >> "$PROJECT_DIR/.env"

            cd "$PROJECT_DIR"
            docker compose pull
            docker compose up -d --remove-orphans
          EOF
